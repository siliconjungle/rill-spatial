name: correctness
on: [push, pull_request]
jobs:
  library:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --locked -p rill-spatial
      - run: cargo test --locked --release -p rill-spatial
      - run: cargo test --locked -p rill-spatial --no-default-features
      - run: cargo test --locked --release -p rill-spatial --all-features
      - run: cargo test --locked -p rill-spatial --no-default-features --features adaptive-batches
  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test javascript/test/*.test.mjs
