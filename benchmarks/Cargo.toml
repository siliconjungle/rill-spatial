[package]
name = "rill-spatial-benchmarks"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rill-spatial = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rstar = "=0.13.0"
kdtree = "=0.8.1"
kd-tree = "=0.6.2"
kiddo = { version = "=6.3.0", default-features = false, features = ["simd", "logging_off"] }
static_aabb2d_index = "=2.1.0"
geo-index = "=0.4.0"
spart = "=0.6.2"
typenum = "1"

