[package]
name = "rill-spatial-benchmarks"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rill-spatial = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rstar = "=0.13.0"
kdtree = "=0.8.1"
kd-tree = "=0.6.2"
kiddo = { version = "=6.3.0", default-features = false, features = ["simd", "logging_off"] }
static_aabb2d_index = "=2.1.0"
geo-index = "=0.4.0"
spart = "=0.6.2"
typenum = "1"
acap = "=0.4.0"
vpsearch = "=2.1.0"
petal-neighbors = "=0.19.0"
ndarray = "0.17"
neighbourhood = "=0.2.0"
self_cell = "1"
quadtree-f32 = { version = "=0.5.0", features = ["f64"] }
quadtree_rs = "=0.1.3"
octree = "=0.1.0"
spatial = "=1.0.1"
nabo = { version = "=0.6.0", default-features = false }

rill-cells = { package = "cell-readview-candidate", path = "../research/variants/cell-readview" }
rill-dual = { package = "rill-spatial-dual-tree", path = "../research/variants/dual-tree" }

rill-radius = { package = "radius-aware-candidate", path = "../research/variants/radius-aware" }

rill-auto = { package = "radius-auto-candidate", path = "../research/variants/radius-auto" }
